name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: bash scripts/install_pinned_moonbit.sh

      - name: Show the toolchain version
        run: |
          mkdir -p _build/schema-suite
          moon version --all | tee _build/schema-suite/toolchain.txt

      - name: Type-check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build
        run: moon build --target native

      - name: JSON Schema standard suite (strict, offline data)
        run: |
          moon run --target native cmd/schema_suite -- \
            --manifest testdata/schema-suite-manifest.json \
            --report-json _build/schema-suite/report.json \
            --report-md docs/schema-compatibility.md \
            --strict
          python3 scripts/check_schema_suite_report.py

      - name: Preserve Schema reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-suite-reports
          path: |
            _build/schema-suite/report.json
            _build/schema-suite/toolchain.txt
            docs/schema-compatibility.md
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: bash ../scripts/install_pinned_moonbit.sh

      - name: Type-check
        run: moon check --target js --deny-warn

      - name: Test
        run: moon test --target js
